---
app_name: hello
app_image: nginxinc/nginx-unprivileged:1.27-alpine
app_port: 8080
app_replicas: 1
app_version: "1.0.0"
app_message: "Hello"
app_env: dev

# Optional: kubeconfig context to target. Leave empty to use the current context.
app_k8s_context: ""

app_resources:
  requests: { cpu: 25m, memory: 16Mi }
  limits: { cpu: 100m, memory: 64Mi }

# How long to wait for the Deployment to become Available.
app_rollout_timeout: 120

# Where the API token comes from:
#   ansible        - from an Ansible variable (dev: plain; prod: ansible-vault), stored as a K8s Secret
#   hashi_lookup   - Ansible reads it from HashiCorp Vault at deploy time, stored as a K8s Secret
#   hashi_injector - no K8s Secret; the Vault Agent Injector writes it into the pod at start-up
app_secret_mode: ansible
app_service_account: "{{ app_name }}"

# HashiCorp Vault settings (used by the hashi_* modes and playbooks/vault-configure.yml).
# The Vault token is read from the VAULT_TOKEN environment variable, never from a file.
app_vault_url: http://127.0.0.1:8200
app_vault_kv_mount: secret
app_vault_secret_path: "{{ app_name }}/{{ app_env }}"
app_vault_k8s_role: "{{ app_name }}-{{ app_env }}"
