---
- name: Remove the hello app namespace
  hosts: k8s_control
  gather_facts: false
  tasks:
    - name: Delete namespace (and everything in it)
      kubernetes.core.k8s:
        context: "{{ app_k8s_context | default(omit, true) }}"
        state: absent
        kind: Namespace
        name: "{{ app_namespace }}"
        wait: true
        wait_timeout: 120
