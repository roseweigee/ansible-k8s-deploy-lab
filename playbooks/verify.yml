---
- name: Verify the hello app is serving
  hosts: k8s_control
  gather_facts: false
  vars:
    app_name: hello
  tasks:
    - name: Read the Deployment status
      kubernetes.core.k8s_info:
        context: "{{ app_k8s_context | default(omit, true) }}"
        kind: Deployment
        namespace: "{{ app_namespace }}"
        name: "{{ app_name }}"
      register: deploy_info

    - name: Check that every replica is ready
      ansible.builtin.assert:
        that:
          - deploy_info.resources | length == 1
          - (deploy_info.resources[0].status.readyReplicas | default(0)) == (app_replicas | int)
        fail_msg: >-
          Expected {{ app_replicas }} ready replicas in {{ app_namespace }},
          found {{ deploy_info.resources[0].status.readyReplicas | default(0) if deploy_info.resources else 'no Deployment' }}.
        success_msg: "{{ app_replicas }}/{{ app_replicas }} replicas ready in {{ app_namespace }}"

    - name: List running pods
      kubernetes.core.k8s_info:
        context: "{{ app_k8s_context | default(omit, true) }}"
        kind: Pod
        namespace: "{{ app_namespace }}"
        label_selectors:
          - app.kubernetes.io/name={{ app_name }}
        field_selectors:
          - status.phase=Running
      register: pods

    - name: Fetch the page from inside the first pod
      kubernetes.core.k8s_exec:
        context: "{{ app_k8s_context | default(omit, true) }}"
        namespace: "{{ app_namespace }}"
        pod: "{{ pods.resources[0].metadata.name }}"
        container: web
        command: wget -qO- http://127.0.0.1:8080/
      register: page
      changed_when: false

    - name: Check the page shows the right environment
      ansible.builtin.assert:
        that:
          - "'env=' ~ app_env in page.stdout"
        fail_msg: "Page did not contain env={{ app_env }}: {{ page.stdout }}"
        success_msg: "Page OK: env={{ app_env }}"

    - name: Check how the token was delivered (Vault Agent Injector)
      when: app_secret_mode | default('ansible') == 'hashi_injector'
      block:
        - name: Check the pod ran the vault-agent-init container
          ansible.builtin.assert:
            that:
              - "'vault-agent-init' in (pods.resources[0].spec.initContainers | default([]) | map(attribute='name'))"
            fail_msg: "No vault-agent-init container: is the injector installed and the annotation applied?"
            success_msg: "vault-agent-init ran in {{ pods.resources[0].metadata.name }}"

        - name: Check the token file exists and is not empty (without printing it)
          kubernetes.core.k8s_exec:
            context: "{{ app_k8s_context | default(omit, true) }}"
            namespace: "{{ app_namespace }}"
            pod: "{{ pods.resources[0].metadata.name }}"
            container: web
            command: sh -c 'test -s /vault/secrets/api-token && echo present'
          register: token_file
          changed_when: false

        - name: Check no K8s Secret holds the token
          kubernetes.core.k8s_info:
            context: "{{ app_k8s_context | default(omit, true) }}"
            kind: Secret
            namespace: "{{ app_namespace }}"
            name: "{{ app_name }}-token"
          register: k8s_secret

        - name: Report
          ansible.builtin.assert:
            that:
              - "'present' in token_file.stdout"
              - k8s_secret.resources | length == 0
            success_msg: "Token delivered by Vault to /vault/secrets/api-token; no K8s Secret in {{ app_namespace }}"
